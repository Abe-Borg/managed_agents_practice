[project]
name = "csv-analyst"
version = "0.1.0"
description = "Explore CSV files with Claude Managed Agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic==1.9.0",
    "fastapi",
    "markdown-it-py",
    "python-dotenv",
    "python-multipart",
    "rich",
    "typer",
    "uvicorn",
]

[project.scripts]
csv-analyst = "csv_analyst.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/csv_analyst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: tests that call the Claude API and require explicit opt-in"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [".git", ".venv", ".tools", ".uv-cache", ".tmp", ".tmp-user"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["csv_analyst"]
strict = true
