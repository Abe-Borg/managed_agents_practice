name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tracked files for an Anthropic API key
        shell: bash
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo 'A local .env file is tracked.' >&2
            exit 1
          fi
          if git grep -qE 'sk-ant-[a-z0-9]+-[A-Za-z0-9_-]{12,}' -- .; then
            echo 'A potential Anthropic API key is tracked.' >&2
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Offline tests
        run: uv run pytest -m "not live"
